name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ['docs/site/**', 'docs/vercel.json', 'vercel.json', '.github/workflows/docs-ci.yml']
  pull_request:
    branches: [main, master]
    paths-ignore: ['docs/site/**', 'docs/vercel.json', 'vercel.json', '.github/workflows/docs-ci.yml']

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        # Uses packageManager from package.json automatically
          
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        # Uses packageManager from package.json automatically
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
