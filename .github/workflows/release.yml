name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        # Uses packageManager from package.json automatically
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC

    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        # Uses packageManager from package.json automatically
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          
      - run: pnpm install
      - run: pnpm build
      
      # Publish with OIDC (Trusted Publishers) - no token needed
      - name: Publish packages
        run: pnpm publish -r --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
